name: Zero-Trace History Cleanup

on:
  workflow_run:
    workflows: ["Render Long Video"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: 🧹 Xóa sạch Workflow History
    runs-on: ubuntu-22.04
    steps:
      - name: Xóa toàn bộ lượt chạy đã hoàn thành
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
